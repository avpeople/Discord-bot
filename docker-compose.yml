services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Always listens (serves GET /health); POST /notify is only enabled
      # if NOTIFY_API_KEY is set. See src/notify-server.js.
      - "${NOTIFY_PORT:-8790}:${NOTIFY_PORT:-8790}"
    # Same check as the Dockerfile HEALTHCHECK, so Coolify sees health
    # whether it builds from the Dockerfile or this compose file.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${NOTIFY_PORT:-8790}/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      ALLOWED_ROLE_ID: ${ALLOWED_ROLE_ID}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_COMMIT_NAME: ${GITHUB_COMMIT_NAME}
      GITHUB_COMMIT_EMAIL: ${GITHUB_COMMIT_EMAIL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_CONFIG_DIR: /data/claude-config
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      WORKSPACE_DIR: /data/workspaces
      # Coolify API (optional) — posts deploy progress after Commit merges
      COOLIFY_URL: ${COOLIFY_URL}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN}
      # Coms bridge for /voice (optional) — see .env.example. Coolify only
      # passes through env vars referenced here.
      COMS_API_URL: ${COMS_API_URL}
      COMS_BRIDGE_KEY: ${COMS_BRIDGE_KEY}
      COMS_ROLE_ID: ${COMS_ROLE_ID}
      # Inbound notify endpoint (optional) — see .env.example
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      NOTIFY_PORT: ${NOTIFY_PORT:-8790}
      # Website editor (optional) — see .env.example
      SITE_CONTENT_URL: ${SITE_CONTENT_URL}
      SITE_CONTENT_API_KEY: ${SITE_CONTENT_API_KEY}
      SITE_EDITOR_ROLE_ID: ${SITE_EDITOR_ROLE_ID}
      SITE_EDITOR_MODEL: ${SITE_EDITOR_MODEL}
      # LiveU status board + studio log alerts (optional) — see .env.example
      LIVEU_EMAIL: ${LIVEU_EMAIL}
      LIVEU_PASSWORD: ${LIVEU_PASSWORD}
      LIVEU_ROLE_ID: ${LIVEU_ROLE_ID}
      # media-mtx site (optional) — see .env.example
      MEDIAMTX_URL: ${MEDIAMTX_URL}
      MEDIAMTX_USERNAME: ${MEDIAMTX_USERNAME}
      MEDIAMTX_PASSWORD: ${MEDIAMTX_PASSWORD}
      MEDIAMTX_EVENTS_API_KEY: ${MEDIAMTX_EVENTS_API_KEY}
      MEDIAMTX_EVENTS_URL: ${MEDIAMTX_EVENTS_URL}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL}
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD}
    volumes:
      - claude-config:/data/claude-config
      - workspaces:/data/workspaces

volumes:
  claude-config:
  workspaces:
